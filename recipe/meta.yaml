{% set name = "vl-convert-python" %}
{% set version = "1.9.0.post1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
    sha256: a5b06b3128037519001166f5341ec7831e19fbd7f3a5f78f73d557ac2d5859ef
    patches:
      - 01-fix-libffi-msvc.patch
      - 02-use-vendored-v8-win-arm64.patch  # [win and arm64]
  - url: https://crates.io/api/v1/crates/v8/0.105.1/download  # [win and arm64]
    fn: v8-0.105.1.tar.gz  # [win and arm64]
    sha256: b3f1b18ae89236d39abfa7136ec712f1d2daab61cddeef00b61a804e8a9b2dee  # [win and arm64]
    folder: v8  # [win and arm64]
    patches:  # [win and arm64]
      - 03-v8-win-arm64.patch  # [win and arm64]
  # The crates.io package excludes this file; use the ICU submodule pinned by rusty_v8.
  - url: https://raw.githubusercontent.com/denoland/icu/a22a8f24224ddda8b856437d7e8560de1da3f8e1/common/icudtl.dat  # [win and arm64]
    sha256: 7c40c811d30d459dbf04a04c141b60eb4247cd58a008fb836605317df665748f  # [win and arm64]
    folder: v8/third_party/icu/common  # [win and arm64]
  - url: https://github.com/libffi-rs/libffi-rs/archive/d0704d634b6f3ffef5b6fc7e07fe965a1cff5c7b.tar.gz  # [win and arm64]
    sha256: 525206092e7844a08869aec91ad95b60553108c402b9252276b9636c0c4c7c13  # [win and arm64]
    folder: libffi-rs  # [win and arm64]
    patches:  # [win and arm64]
      - 04-libffi-msvc-include.patch  # [win and arm64]
  - url: https://github.com/denoland/ninja_gn_binaries/archive/20221218.tar.gz  # [win and arm64]
    sha256: 9669232e136c284036b43029855120fd76d0d14af1bcfc0c150bbcc07860ca02  # [win and arm64]
    folder: ninja_gn_binaries  # [win and arm64]

build:
  number: 2

requirements:
  build:
    - {{ compiler('c') }}     # [not win64]
    - {{ compiler('rust') }}
    - {{ stdlib('c') }}
    - make                   # [not win]
    - cmake
    - protobuf
    - libffi  
    - jq                     # [linux and x86_64]
    - libclang               # [linux and x86_64]
    - llvmdev                # [linux and x86_64]
    - ninja-base             # [win and arm64]
    - libclang               # [win and arm64]
    - nasm                   # [win]
  host:
    - python
    - pip
    - maturin >=1.1.0,<2.0.0
    - sqlite                 
    - pkg-config           
    - libffi
    - libiconv  # [osx]
  run:
    - python
    - libzlib
    - libffi 

# Test are not run because pypdfium2 is not in the main channel
test:
  imports:
    - vl_convert
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/jonmmease/vl-convert
  summary: Convert Vega-Lite chart specifications to SVG, PNG, or Vega
  description: |
          vl-convert-python is a dependency-free Python package for converting Vega-Lite chart specifications
          into static images (SVG or PNG) or Vega chart specifications.
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - vl-convert-python/LICENSE
    - vl-convert-python/thirdparty_font.md        # [not arm64 and not linux]
    - vl-convert-python/thirdparty_javascript.md  # [not arm64 and not linux]
    - vl-convert-python/thirdparty_rust.yaml      # [not arm64 and not linux]
  doc_url: https://github.com/jonmmease/vl-convert/tree/main
  dev_url: https://github.com/jonmmease/vl-convert/tree/main

extra:
  recipe-maintainers:
    - jonmmease
